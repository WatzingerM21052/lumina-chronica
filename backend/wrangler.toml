name = "lumina-chronica-api"
main = "src/index.ts"
compatibility_date = "2026-07-29"

# Not secret -- where OAuth callbacks (issue #40) redirect the browser back
# to after issuing an exchange code, and where password-reset emails link
# to. Overridden in .dev.vars for local dev. Custom domain (2026-09-26,
# see docs/superpowers/specs/2026-09-26-forgot-password-design.md and PR
# #473) -- no path segment, unlike the old GitHub Pages *project* site URL,
# since a custom domain is served from the repo root.
[vars]
FRONTEND_URL = "https://luminachronica.com"

[[d1_databases]]
binding = "DB"
database_name = "lumina-chronica-db"
database_id = "58529253-b434-4051-9d5f-9b97f4d095dc"
migrations_dir = "../database/migrations"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "lumina-chronica-storage"

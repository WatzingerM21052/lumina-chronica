name = "lumina-chronica-api"
main = "src/index.ts"
compatibility_date = "2026-07-29"

# Not secret -- where OAuth callbacks (issue #40) redirect the browser back
# to after issuing an exchange code. Overridden in .dev.vars for local dev.
[vars]
FRONTEND_URL = "https://watzingerm21052.github.io/lumina-chronica"

[[d1_databases]]
binding = "DB"
database_name = "lumina-chronica-db"
database_id = "58529253-b434-4051-9d5f-9b97f4d095dc"
migrations_dir = "../database/migrations"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "lumina-chronica-storage"

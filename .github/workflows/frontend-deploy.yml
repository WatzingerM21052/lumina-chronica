name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "tests/frontend/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Gate the deploy on the test suite: a push to main goes live
      # immediately, so a red suite must stop it here rather than only
      # showing up in ci.yml's parallel run afterwards.
      - name: Run frontend tests
        run: dotnet test tests/frontend/LuminaChronica.Client.Tests.csproj --nologo

      - name: Publish Blazor WebAssembly app
        run: dotnet publish frontend/LuminaChronica.Client/LuminaChronica.Client.csproj -c Release -o release --nologo

      - name: Add .nojekyll (so Pages serves Blazor's _framework/ folder)
        run: touch release/wwwroot/.nojekyll

      - name: Add 404.html fallback for client-side routing
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: release/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v5

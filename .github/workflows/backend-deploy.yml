name: Deploy backend to Cloudflare Workers

# Manual trigger only, on purpose: a backend release often needs a D1
# migration applied by hand first, which should stay a conscious step rather
# than something a push to main sets off. Uses the CLOUDFLARE_API_TOKEN repo
# secret. See documentation/Architecture.md ("CI/CD").
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - run: npm ci

      # Same gate as the frontend deploy: never ship a Worker whose own suite
      # or typecheck is red.
      - name: Typecheck backend
        run: npx tsc --noEmit

      - name: Run backend tests
        run: npm ci && npx vitest run
        working-directory: tests/backend

      # Review §3.3: a Worker whose migration or secret is missing fails
      # quietly (the reset flow answers 200 and sends nothing), so check both
      # before shipping. A check that cannot run (API outage, a token
      # without D1/secret read access) only warns -- it must never be the
      # reason a deploy can't happen.
      - name: Check remote migrations and secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if migrations=$(npx wrangler d1 migrations list lumina-chronica-db --remote 2>&1); then
            if echo "$migrations" | grep -qi "No migrations to apply"; then
              echo "All D1 migrations are applied."
            else
              echo "$migrations"
              echo "::error::Unapplied D1 migrations. Apply them first: npx wrangler d1 migrations apply lumina-chronica-db --remote"
              exit 1
            fi
          else
            echo "$migrations"
            echo "::warning::Could not list the remote D1 migrations; deploying without that check."
          fi

          if secrets=$(npx wrangler secret list --format json 2>/dev/null); then
            missing=""
            for name in JWT_SECRET PASSWORD_CODE_SECRET RESEND_API_KEY; do
              echo "$secrets" | jq -e --arg n "$name" 'map(.name) | index($n)' >/dev/null || missing="$missing $name"
            done
            if [ -n "$missing" ]; then
              echo "::error::Worker secrets missing:$missing (npx wrangler secret put <NAME>)"
              exit 1
            fi
            echo "Required secrets are set."
          else
            echo "::warning::Could not list the Worker secrets; deploying without that check."
          fi

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: backend
          # The SHA shows up as "version" in GET /api/status (review §3.3).
          command: deploy --var APP_VERSION:${{ github.sha }}

      # Fails the run if the live Worker doesn't report the SHA just deployed
      # (a few retries: the new version needs a moment to reach every edge).
      - name: Smoke test /api/status
        run: |
          for attempt in 1 2 3 4 5 6; do
            version=$(curl -fsS https://lumina-chronica-api.svhofkirchen-api.workers.dev/api/status | jq -r .data.version || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "Live version $version"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Live version '$version' is not the deployed $GITHUB_SHA"
          exit 1

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/tests/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/frontend/LuminaChronica.Client"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/tests/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

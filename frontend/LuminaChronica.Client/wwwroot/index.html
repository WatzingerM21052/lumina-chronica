<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina Chronica</title>
    <!-- "/" here is correct for local `dotnet run`. The GitHub Pages deploy
         workflow rewrites this to "/lumina-chronica/" in the published
         output only — see .github/workflows/frontend-deploy.yml. -->
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preload" href="fonts/fraunces-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="Styles/fonts.css" />
    <link rel="stylesheet" href="Styles/tokens.css" />
    <link rel="stylesheet" href="Styles/themes/classic-library.css" />
    <link rel="stylesheet" href="Styles/themes/modern-light.css" />
    <link rel="stylesheet" href="Styles/themes/dark-library.css" />
    <link rel="stylesheet" href="Styles/themes/system.css" />
    <link rel="stylesheet" href="Styles/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="LuminaChronica.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script type="module">
        import { applyStoredTheme } from "./js/theme.js";
        applyStoredTheme();
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>

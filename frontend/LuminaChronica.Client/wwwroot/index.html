<!DOCTYPE html>
<!-- German is the app's default language; the script below switches this
     to the stored UI language before anything renders, so screen readers
     pronounce and CSS hyphenates in the right language. -->
<html lang="de">

<head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the layout use env(safe-area-inset-*) around
         notches and the home indicator (UI/UX plan B1). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lumina Chronica</title>
    <!-- "/" is correct for local `dotnet run` and for the custom domain
         (luminachronica.com), which GitHub Pages serves from the repo
         root. The old project-page URL (*.github.io/lumina-chronica/)
         keeps working as a fallback if the custom domain is ever
         unreachable (DNS issues, etc.) -- it needs the "/lumina-chronica/"
         subpath instead, which this inline script switches to before any
         relative-URL resource below is requested. Must run before the
         first <link>/<script> that fetches a relative URL. -->
    <base href="/" id="app-base" />
    <script>
        if (location.hostname.endsWith(".github.io")) {
            document.getElementById("app-base").setAttribute("href", "/lumina-chronica/");
        }
        // Same storage key as js/i18n.js; storage can be unavailable.
        try {
            document.documentElement.lang = localStorage.getItem("lumina-chronica-language") || "de";
        } catch (e) { }
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="preload" href="fonts/fraunces-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="Styles/fonts.css" />
    <link rel="stylesheet" href="Styles/tokens.css" />
    <link rel="stylesheet" href="Styles/themes/classic-library.css" />
    <link rel="stylesheet" href="Styles/themes/modern-light.css" />
    <link rel="stylesheet" href="Styles/themes/dark-library.css" />
    <link rel="stylesheet" href="Styles/themes/system.css" />
    <link rel="stylesheet" href="Styles/themes/babylon.css" />
    <link rel="stylesheet" href="Styles/themes/alexandria.css" />
    <link rel="stylesheet" href="Styles/app.css" />
    <link rel="stylesheet" href="Styles/journey.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link href="LuminaChronica.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script type="module">
        import { applyStoredTheme } from "./js/theme.js";
        import { applyStoredShowCoverText } from "./js/shelfCoverText.js";
        applyStoredTheme();
        applyStoredShowCoverText();
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
